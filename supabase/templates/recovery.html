<h2>Restablece tu contraseña</h2>
<p>
  Usa este enlace para elegir una contraseña nueva. Es de un solo uso y expira
  pronto:
</p>
<p>

  >
</p>
<p>Si no lo solicitaste, ignora este mensaje.</p>
